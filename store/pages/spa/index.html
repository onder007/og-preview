<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Önder Bakır</title>
  <meta property="og:title" content="Önder Bakır">
  <meta property="og:description" content="Backend systems with Python and TypeScript, real-time computer vision and security-minded web tooling.">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Like a client-side router: the real share tags only exist after JavaScript runs.
    document.querySelector('meta[property="og:title"]').content = 'Önder Bakır — Software Developer';
    const image = document.createElement('meta');
    image.setAttribute('property', 'og:image');
    image.content = 'https://lh3.googleusercontent.com/d/1uPxoT-j2VxR-HmTShjUAN52nOAy3yh51=w1200';
    document.head.append(image);
  </script>
</head>
<body><h1>Single-page app build of onderbakir.com whose share tags are set by JavaScript</h1></body>
</html>
